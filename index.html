<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <style>
    header {
      background-color: #183C63;
      color: #FFFFFF;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    main {
      background-color: #FFFFFF;
      color: #183C63;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
    }

    img {
      width: 80px;
      height: 80p;
    }

    .artigo-autor {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>Livia Cosmeticos</h1>
    <p>Irei falar da mudança que os cosmeticos melhoram na sua beleza</p>
  </header>
  <main>
    <img src="livia.png"
      alt="Ícone branco em fundo azul escuro com ilustrações de produtos de beleza e cuidados com a pele, incluindo um frasco com conta-gotas, uma garrafa de loção, um pote de creme, um pincel de maquiagem e folhas de plantas ao fundo">
    <div>
      <h2>Meu primeiro post</h2>
      <p class="artigo-autor">Por: Livia Bazan Bianchini</p>
      <p>Boas-Vindas ao meu novo blog! Aqui vou compartilhar dicas de beleza e novidades dessa área.</p>
      <button>💄<span>0</span></button>
      <button>👛<span>0</span></button>
    </div>
    <main>
    </main>
</body>
<script>
  const botoes = document.querySelectorAll("button");

  botoes.forEach(function (botao) {
    let curtiu = false;
    botao.addEventListener("click", botaoClicado);
    function botaoClicado() {
      console.log("fui clicado");
      let texto = botao.querySelector("span");
      if (curtiu === false) {
        texto.textContent++;
        curtiu = true;
      } else {
        texto.textContent--;
        curtiu = false;
      }
    }
  })


</script>

</html>
